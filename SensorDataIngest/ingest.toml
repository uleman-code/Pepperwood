config_version = "0.5"

[application]
site_metadata_file = "site_metadata.csv"
column_metadata_file = "column_metadata.csv"
debug = false
console_logging_level = "INFO"
file_logging_level = "DEBUG"
logging_directory = "./logs"
logfile_max_size = "10 MB"
logfile_backup_count = 3

[input]
datalogger_file_extensions = [
    ".dat",
    ".csv",
]
excel_file_extensions = [
    ".xlsx",
    ".xls",
]

[output]
data_na_representation = "#N/A"
notes_columns = [
    "Start of issue",
    "End of issue",
    "Sensor or Data Field",
    "Data Omitted",
    "Nature of problem",
]
[output.worksheet_names]
data    = "Data"
meta    = "Columns"
station = "Meta"
notes   = "Notes"

[metadata]
# Keep the first two in sync with column metadata, meaning that they must be found
# there in the Name column for all values of the SiteKey.
timestamp_column = "Timestamp"
sequence_number_column = "SeqNum"
sampling_interval = "15min"          # Used as default if not found in site metadata
# Arbitrary: Names of columns for variable metadata found in the first few rows of a data logger file.
variable_description_columns = [
    "Name",
    "Units",
    "Data Process",
]
# Arbitrary: Names of columns for metadata found in the first few rows of a data logger file.
station_columns = [
    "Data File Format",
    "Station Name",              # Must be different from the first column in site metadata (usually, Site ID)
    "Data Logger Model",
    "Data Logger Serial Number",
    "Data Logger OS Version",
    "Data Logger Program Name",
    "Data Logger Program Signature",
    "Table Name",
]
site_key_column = "SiteKey"
